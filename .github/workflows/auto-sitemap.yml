name: Auto-update XML sitemap
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate_sitemap.py'
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: highland-lakes-sitemap
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate sitemap from all site pages
        run: python scripts/generate_sitemap.py
      - name: Commit and publish sitemap when changed
        run: |
          git config user.name "Highland Lakes Sitemap Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Automatically refresh sitemap for Google"
            git push
          fi
