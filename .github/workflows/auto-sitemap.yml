name: Auto-update XML sitemap
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate_sitemap.py'
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: highland-lakes-sitemap
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit and publish sitemap with retry for concurrent updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Highland Lakes Sitemap Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A news-page update can arrive while the sitemap job is running.
          # Regenerate from the newest main branch on every attempt.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Discard only the previously generated sitemap before syncing.
            # Otherwise checkout can fail when a newer commit changed sitemap.xml.
            git restore --source=HEAD --staged --worktree sitemap.xml || true
            git checkout -B main origin/main
            python scripts/generate_sitemap.py
            git add sitemap.xml
            if git diff --cached --quiet; then
              echo "Sitemap already current."
              exit 0
            fi
            git commit -m "Automatically refresh sitemap for Google"
            if git push origin HEAD:main; then
              echo "Sitemap published."
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/5)."
            git reset --hard HEAD
            sleep 3
          done
          echo "Could not publish sitemap after five attempts." >&2
          exit 1
